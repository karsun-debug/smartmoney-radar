[project]
name = "spiderhead"
version = "0.5.0"
description = "Track famous US investors' public posts against their SEC filings"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pypdf>=4"]

[project.optional-dependencies]
llm = ["anthropic>=2.5"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "reportlab>=4", "mcp>=2.3"]

[project.scripts]
spiderhead = "spiderhead.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spiderhead"]
