# Every 2 hours: collect new posts / filings -> send instant LINE alerts for new calls and trades.
# Uses the same secrets and database cache as daily.yml.
# Cost note: ~2 min per run x 12 runs/day ≈ 720 min/month (free for public repos;
# private repos get 2,000 free minutes/month on the Free plan).
name: instant-alerts

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # the 'data' branch holds the database snapshot

concurrency:
  group: spiderhead-db
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      SPIDERHEAD_USER_AGENT: ${{ secrets.SPIDERHEAD_USER_AGENT }}
      SPIDERHEAD_DB: data/spiderhead.db
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SPIDERHEAD_MY_TICKERS: ${{ secrets.SPIDERHEAD_MY_TICKERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm]"
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: spiderhead-db-${{ github.run_id }}
          restore-keys: spiderhead-db-

      - name: Restore database from data branch (preferred over cache)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/data_branch.sh restore
      - name: Collect
        run: spiderhead fetch --days 2 --sources sources.example.json ${{ env.ANTHROPIC_API_KEY != '' && '--llm' || '' }}
      - name: Send alerts
        run: spiderhead alert
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: spiderhead-db-${{ github.run_id }}
      - name: Save database to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/data_branch.sh save
