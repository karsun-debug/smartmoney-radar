# Every day: collect posts & news -> push LINE digest -> publish dashboard to GitHub Pages.
# Secrets (Settings > Secrets and variables > Actions):
#   SPIDERHEAD_USER_AGENT      e.g. "SpiderHead you@example.com" (required by SEC)
#   LINE_CHANNEL_ACCESS_TOKEN  LINE Messaging API channel access token
#   LINE_TO                    optional userId/groupId; empty = broadcast to all friends
#   ANTHROPIC_API_KEY          optional; enables Claude analysis (--llm)
#   X_BEARER_TOKEN             optional; enables X (Twitter) collection
# Enable Pages: Settings > Pages > Source: GitHub Actions.
# Note: on free plans, Pages sites are public even if the repo is private.
name: daily-digest

on:
  schedule:
    - cron: "17 23 * * *"   # 07:17 Taiwan time
  workflow_dispatch:

permissions:
  contents: write   # the 'data' branch holds the database snapshot
  pages: write
  id-token: write

concurrency:
  group: spiderhead-db   # shared with alerts.yml so runs never race on the database
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SPIDERHEAD_USER_AGENT: ${{ secrets.SPIDERHEAD_USER_AGENT }}
      SPIDERHEAD_DB: data/spiderhead.db
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm]"

      # Keep the post history between runs.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: spiderhead-db-${{ github.run_id }}
          restore-keys: spiderhead-db-

      - name: Restore database from data branch (preferred over cache)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/data_branch.sh restore

      - name: Collect posts and news
        run: spiderhead fetch --days 3 --sources sources.example.json ${{ env.ANTHROPIC_API_KEY != '' && '--llm' || '' }}

      - name: Scan market-wide insider buys (Form 4)
        continue-on-error: true
        run: spiderhead insiders --days 3

      - name: Build dashboard
        run: spiderhead dashboard --out site --days 90 --with-13f

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Push LINE digest
        if: env.LINE_CHANNEL_ACCESS_TOKEN != ''
        run: spiderhead push-line --days 1 --dashboard-url "${{ steps.deploy.outputs.page_url }}"

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: spiderhead-db-${{ github.run_id }}
      - name: Save database to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/data_branch.sh save
